<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Member</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center mb-4">Edit Member</h2>
    <div class="card p-4 mx-auto" style="max-width: 600px;">
        <form th:action="@{/members/update}" th:object="${member}" method="post">
            <div class="mb-3">
                <label class="form-label">First Name:</label>
                <input type="text" th:field="*{firstName}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Last Name:</label>
                <input type="text" th:field="*{lastName}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Membership ID:</label>
                <input type="text" th:field="*{membershipId}" class="form-control" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Last Renewal Date:</label>
                <input type="date" th:field="*{lastRenewalDate}" class="form-control" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Update Member</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fitness Center Membership Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Fitness Center Membership Management</h2>

    <div class="card p-4 mx-auto mb-5" style="max-width: 600px;">
        <h4 class="text-center mb-3">Insert New Member</h4>
        <form th:action="@{/members/add}" th:object="${member}" method="post">
            <div class="mb-3">
                <label class="form-label">First Name:</label>
                <input type="text" th:field="*{firstName}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Last Name:</label>
                <input type="text" th:field="*{lastName}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Membership ID:</label>
                <input type="text" th:field="*{membershipId}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Last Renewal Date:</label>
                <input type="date" th:field="*{lastRenewalDate}" class="form-control" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-success">Add Member</button>
            </div>
        </form>
    </div>

    <h4 class="mb-3">Members Details (Renewal Date):</h4>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Membership ID</th>
            <th>Last Renewal Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${members}">
            <td th:text="${m.firstName}">First</td>
            <td th:text="${m.lastName}">Last</td>
            <td th:text="${m.membershipId}">ID</td>
            <td th:text="${m.lastRenewalDate}">Date</td>
            <td>
                <a th:href="@{/members/edit/{id}(id=${m.membershipId})}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{/members/delete/{id}(id=${m.membershipId})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this member?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
